# =============================================================================
# hermes-suite — docker-compose.yaml
#
# Drop-in for official hermes-agent. WebUI is opt-in (HERMES_WEBUI=1).
# Dashboard is opt-in (HERMES_DASHBOARD=1) — same as upstream.
# =============================================================================

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_VERSION: ${AGENT_VERSION:-v2026.7.20}
        HERMES_WEBUI_VERSION: ${WEBUI_VERSION:-v0.52.76}
    image: hermes-suite:${HERMES_SUITE_IMAGE_TAG:-latest}
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
      - "8787:8787"
    volumes:
      - ${HERMES_HOST_HOME:-~/.hermes}:/opt/data
      - ${HERMES_HOST_WORKSPACE:-~/workspace}:/workspace
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_DATA_DIR=/opt/data
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-0}
      - HERMES_WEBUI=${HERMES_WEBUI:-0}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-admin}
      - HERMES_UID=${HERMES_UID:-}
      - HERMES_GID=${HERMES_GID:-}
    deploy:
      resources:
        limits:
          memory: 4G
